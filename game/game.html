<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<title>VEXA Games — 100+ vs Bot</title>
<style>
:root{--bg1:#0a0a0f;--bg2:#12121a;--bg3:#1a1a26;--bg4:#20202e;--tx:#f0f0f5;--tx2:#9a9ab0;--tx3:#6a6a80;--ac:#6c5ce7;--acs:rgba(108,92,231,.16);--ok:#2ecc71;--oks:rgba(46,204,113,.15);--dn:#e74c3c;--dns:rgba(231,76,60,.15);--wn:#f39c12;--wns:rgba(243,156,18,.15);--bd:rgba(255,255,255,.09);--bds:rgba(255,255,255,.16);--gr:linear-gradient(135deg,#6c5ce7,#a29bfe)}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:Inter,system-ui,sans-serif;background:var(--bg1);color:var(--tx);font-size:14.5px;line-height:1.5;display:flex;flex-direction:column}
.hidden{display:none!important}
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-thumb{background:var(--bg4);border-radius:99px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:10px 16px;border-radius:10px;font-size:13.5px;font-weight:600;border:none;color:inherit;cursor:pointer;transition:.15s}
.btn:active{transform:scale(.96)}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
.bp{background:var(--gr);color:#fff}.bg2{background:var(--bg3)}.bok{background:var(--oks);color:var(--ok)}.bdn{background:var(--dns);color:var(--dn)}
.bsm{padding:7px 12px;font-size:12px}
.inp{width:100%;padding:11px 14px;background:var(--bg3);border:1.5px solid var(--bd);border-radius:10px;font-size:14px;color:inherit;outline:none;font-family:inherit}
.inp:focus{border-color:var(--ac)}
.mut{color:var(--tx2)}.sm{font-size:12px}.tc{text-align:center}.mono{font-family:monospace}
.mt8{margin-top:8px}.mt16{margin-top:16px}.mb8{margin-bottom:8px}
.gtop{height:54px;flex-shrink:0;display:flex;align-items:center;gap:10px;padding:0 12px;background:rgba(14,14,20,.9);border-bottom:1px solid var(--bd)}
.gt{font-size:16px;font-weight:800}.gt span{background:var(--gr);-webkit-background-clip:text;background-clip:text;color:transparent}
.bico{width:38px;height:38px;border-radius:50%;background:var(--bg3);display:flex;align-items:center;justify-content:center;font-size:16px;border:none;color:inherit;cursor:pointer;flex-shrink:0}
.scr{flex:1;overflow-y:auto;padding:12px 12px calc(80px + env(safe-area-inset-bottom))}
.chips{display:flex;gap:7px;overflow-x:auto;padding:10px 0}
.chip{padding:7px 13px;border-radius:99px;font-size:12px;font-weight:700;background:var(--bg3);color:var(--tx2);cursor:pointer;white-space:nowrap;border:1.5px solid transparent}
.chip.sel{background:var(--acs);color:var(--ac);border-color:var(--ac)}
.ggrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(105px,1fr));gap:9px}
.gcard{background:var(--bg2);border:1px solid var(--bd);border-radius:13px;padding:12px 8px;text-align:center;cursor:pointer;transition:.15s}
.gcard:active{transform:scale(.94);border-color:var(--ac)}
.gcard .gi{font-size:25px}.gcard .gn{font-size:11.5px;font-weight:700;margin-top:5px}.gcard .gv{font-size:9.5px;color:var(--tx3)}
.gbar{display:flex;align-items:center;gap:9px;margin-bottom:11px;flex-wrap:wrap}
.gstat{background:var(--bg3);border-radius:9px;padding:7px 12px;font-size:12.5px;font-weight:700}
.gstat.you{color:var(--ok)}.gstat.bot{color:var(--wn)}
.arena{background:var(--bg2);border:1px solid var(--bd);border-radius:14px;padding:14px}
.tttg{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;max-width:290px;margin:0 auto}
.tttc{aspect-ratio:1;background:var(--bg3);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:38px;font-weight:900;cursor:pointer;border:none;color:inherit}
.tttc.x{color:var(--ac)}.tttc.o{color:var(--wn)}.tttc.win{background:var(--oks)}
.c4g{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;background:var(--acs);padding:9px;border-radius:10px;max-width:360px;margin:0 auto}
.c4c{aspect-ratio:1;border-radius:50%;background:var(--bg1);cursor:pointer;border:none}
.c4c.p1{background:var(--ac)}.c4c.p2{background:var(--wn)}.c4c.win{outline:3px solid var(--ok)}
.chb{display:grid;grid-template-columns:repeat(8,1fr);max-width:340px;margin:0 auto;border:2px solid var(--bds);border-radius:8px;overflow:hidden;user-select:none}
.chc{aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:26px;cursor:pointer;user-select:none}
.chc.dk{background:var(--bg4)}.chc.lt{background:var(--bg2)}
.chc.sel2{outline:2.5px solid var(--ok);outline-offset:-2.5px}.chc.mv{background:var(--oks)!important}
.track{display:grid;grid-template-columns:repeat(10,1fr);gap:3px;max-width:400px;margin:0 auto}
.trc{aspect-ratio:1;background:var(--bg3);border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:12px;position:relative;min-width:0}
.trc.fin{background:var(--oks)}
.tok{width:10px;height:10px;border-radius:50%;position:absolute;top:2px}
.tok.a{background:var(--ac);left:3px}.tok.b{background:var(--wn);right:3px}
.snlb{display:grid;grid-template-columns:repeat(10,1fr);gap:2px;max-width:400px;margin:0 auto}
.snlc{aspect-ratio:1;background:var(--bg3);border-radius:4px;font-size:9px;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;color:var(--tx2)}
.snlc.fin{background:var(--oks);color:var(--ok)}
.snlc .pt{position:absolute;width:9px;height:9px;border-radius:50%;top:2px}
.snlc .pa{background:var(--ac);left:3px}.snlc .pb{background:var(--wn);right:3px}
.dpad{display:grid;grid-template-columns:repeat(3,56px);gap:6px;justify-content:center;margin-top:12px}
.dpb{height:48px;border-radius:10px;background:var(--bg3);font-size:19px;border:1px solid var(--bd);color:inherit;cursor:pointer}
canvas.gcv{max-width:100%;border-radius:10px;background:var(--bg1);display:block;margin:0 auto;touch-action:none}
.memg{display:grid;gap:6px;max-width:400px;margin:0 auto}
.memc{aspect-ratio:1;background:var(--bg3);border-radius:9px;font-size:24px;display:flex;align-items:center;justify-content:center;cursor:pointer;border:none;color:transparent;min-width:0}
.memc.up{background:var(--acs);color:var(--tx)}.memc.done{background:var(--oks);color:var(--tx);cursor:default}
.holes{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:320px;margin:0 auto}
.hole{aspect-ratio:1;background:var(--bg1);border-radius:50%;border:2px solid var(--bd);font-size:30px;display:flex;align-items:center;justify-content:center;cursor:pointer;border:none;color:transparent}
.hole.up{background:var(--wns);color:var(--wn)}
.simon{display:grid;grid-template-columns:1fr 1fr;gap:9px;max-width:300px;margin:0 auto}
.spad{aspect-ratio:1.6;border-radius:12px;opacity:.45;cursor:pointer;border:none}
.spad.lit{opacity:1;box-shadow:0 0 18px currentColor}
.msgs{max-height:100px;overflow-y:auto;font-size:12.5px;color:var(--tx2);background:var(--bg1);border-radius:9px;padding:9px 11px;margin-top:10px}
.letters{display:flex;flex-wrap:wrap;gap:5px;justify-content:center;margin:10px 0}
.letb{width:32px;height:36px;background:var(--bg3);border-radius:8px;font-size:15px;font-weight:800;border:none;color:inherit;cursor:pointer}
.letb:disabled{opacity:.35}.letb.hit{background:var(--oks);color:var(--ok)}
.optb{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.optb .btn{width:100%}
.pword{font-family:'Courier New',monospace;font-size:24px;letter-spacing:5px;text-align:center;font-weight:800;word-break:break-all}
.bigres{font-size:21px;font-weight:900;text-align:center;margin:8px 0}
.bigres.w{color:var(--ok)}.bigres.l{color:var(--dn)}.bigres.d{color:var(--wn)}
.aimt{position:absolute;border-radius:50%;background:radial-gradient(circle,#ff6b6b,#e74c3c);cursor:pointer;box-shadow:0 0 12px rgba(231,76,60,.6)}
#aimAr{position:relative;aspect-ratio:1;max-width:360px;margin:0 auto;background:var(--bg1);border-radius:12px;overflow:hidden;border:1px solid var(--bd)}
.pwr{height:14px;background:var(--bg3);border-radius:99px;overflow:hidden;margin:10px auto;max-width:300px}
.pwr .pf{height:100%;background:var(--gr);width:50%}
.gbot{height:calc(56px + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);background:rgba(14,14,20,.92);backdrop-filter:blur(14px);border-top:1px solid var(--bd);display:flex;flex-shrink:0;position:relative}
.gbi{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:9.5px;font-weight:700;cursor:pointer;border:none;background:none;color:var(--tx3)}
.gbi .bi{font-size:19px}
.gbi.act{color:var(--ac)}
#eyeBtn{position:fixed;z-index:9600;display:flex;align-items:center;gap:4px;touch-action:none}
#eyeBtn.docked{position:static;flex-direction:column;gap:1px;flex:1}
.globeEye{width:52px;height:52px;border-radius:50%;background:var(--bg4);border:2px solid var(--ac);font-size:22px;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 18px rgba(0,0,0,.45);cursor:pointer;color:inherit}
#eyeBtn.docked .globeEye{width:40px;height:40px;font-size:18px;border-width:1.5px}
.eyeLock{width:20px;height:20px;border-radius:50%;background:var(--bg3);border:1px solid var(--bds);font-size:10px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--tx2)}
.gmbox{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:900;display:none;align-items:center;justify-content:center;padding:16px}
.gmbox.open{display:flex}
.gmbox .in{background:var(--bg2);border:1px solid var(--bds);border-radius:16px;max-width:440px;width:100%;max-height:85vh;overflow-y:auto;padding:18px}
.gmhd{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.gmhd b{font-size:15px}
.toastt{position:fixed;bottom:84px;left:50%;transform:translateX(-50%);z-index:9999;background:var(--bg4);border:1px solid var(--bds);border-radius:10px;padding:10px 16px;font-size:13px;font-weight:600}
#errBar{display:none;position:fixed;top:0;left:0;right:0;z-index:99999;background:#e74c3c;color:#fff;font-size:12px;padding:6px 10px;font-family:monospace;word-break:break-all}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important}}
</style>
</head>
<body>

<div id="errBar"></div>

<header class="gtop">
  <button class="bico hidden" id="backB" onclick="UI.home()">←</button>
  <div class="gt">🎮 VEXA <span id="gCount">…</span></div>
  <div style="flex:1"></div>
  <button class="bico" onclick="UI.scores()">🏆</button>
  <button class="bico" onclick="UI.how()">❓</button>
</header>

<main class="scr" id="listView">
  <input class="inp" id="srch" placeholder="🔍 Search games...">
  <div class="chips" id="chips"></div>
  <div class="ggrid" id="ggrid"></div>
  <div class="tc sm mut mt16">🤖 Sab games VEXA-Bot ke against · 📴 Offline chalta hai</div>
</main>

<main class="scr hidden" id="gameView">
  <div class="gbar" id="gbar"></div>
  <div class="arena" id="arena"></div>
  <div class="msgs" id="glog"></div>
</main>

<nav class="gbot" id="gbot">
  <button class="gbi act" id="nbHome" onclick="UI.home()"><span class="bi">🏠</span>Home</button>
  <button class="gbi" onclick="UI.scores()"><span class="bi">🏆</span>Best</button>
  <button class="gbi" onclick="UI.how()"><span class="bi">❓</span>Help</button>
</nav>

<div id="eyeBtn">
  <button class="globeEye" id="eyeMain">🙈</button>
  <button class="eyeLock" id="eyeLockB">🔓</button>
</div>

<div class="gmbox" id="gm"><div class="in">
  <div class="gmhd"><b id="gmT"></b><button class="btn bg2 bsm" id="gmX">✕ Close</button></div>
  <div id="gmIn"></div>
</div></div>

<script>
/* ⭐ ERROR SCREEN PE DIKHEGA — console ki zaroorat nahi */
window.onerror=function(msg,src,line){
  var b=document.getElementById('errBar');
  if(b){b.style.display='block';b.textContent='⚠️ ERROR: '+msg+' — line '+line;}
  return false;
};

/* ============ HELPERS ============ */
function h(s){var d=document.createElement('div');d.innerHTML=s.trim();return d.firstElementChild}
function $(i){return document.getElementById(i)}
function rnd(n){return Math.floor(Math.random()*n)}
function pick(a){return a[rnd(a.length)]}
function clamp(v,a,b){return Math.min(Math.max(v,a),b)}
function log(m){var l=$('glog');if(!l)return;l.insertAdjacentHTML('beforeend','<div>'+m+'</div>');l.scrollTop=l.scrollHeight}
var BOT='VEXA-Bot';

/* CLEANUP — game switch pe timers/RAF/listeners sab band */
var CLEAN=[];
function onClean(fn){CLEAN.push(fn)}
function runClean(){CLEAN.forEach(function(f){try{f()}catch(e){}});CLEAN=[]}

/* MULTI-TIMER — ek saath kitne bhi interval */
var TMR={list:[],
 every:function(ms,fn){var id=setInterval(fn,ms);this.list.push(id);return id},
 after:function(ms,fn){var id=setTimeout(fn,ms);this.list.push(id);return id},
 stop:function(){this.list.forEach(function(id){clearInterval(id);clearTimeout(id)});this.list=[]}};
var RAF={id:null,
 loop:function(fn){var s=this,step=function(t){fn(t);s.id=requestAnimationFrame(step)};this.id=requestAnimationFrame(step)},
 stop:function(){if(this.id)cancelAnimationFrame(this.id);this.id=null}};

var HS={
 get:function(k){try{var a=JSON.parse(localStorage.getItem('vexaGHS')||'{}');return a[k]||0}catch(e){return 0}},
 set:function(k,v){try{var a=JSON.parse(localStorage.getItem('vexaGHS')||'{}');if(!(k in a)||v>a[k]){a[k]=v;localStorage.setItem('vexaGHS',JSON.stringify(a))}}catch(e){}}
};

/* ============ MODAL ============ */
function gm(title,html){$('gmT').textContent=title;$('gmIn').innerHTML=html;$('gm').classList.add('open')}
function gmClose(){$('gm').classList.remove('open')}
 $('gmX').onclick=gmClose;
 $('gm').addEventListener('click',function(e){if(e.target===$('gm'))gmClose()});
function toast(m){var e=h('<div class="toastt">'+m+'</div>');document.body.appendChild(e);setTimeout(function(){e.remove()},2200)}

/* ============ EYE ============ */
var EMBED=new URLSearchParams(location.search).get('embed')==='1';
var Eye={
 locked:false,pos:null,dragging:false,
 init:function(){
  this.locked=localStorage.getItem('vexaEyeLock')==='1';
  try{this.pos=JSON.parse(localStorage.getItem('vexaEyePos')||'null')}catch(e){this.pos=null}
  $('eyeMain').textContent='🙈';
  $('eyeLockB').onclick=function(e){e.stopPropagation();Eye.toggleLock()};
  $('eyeMain').addEventListener('pointerdown',function(e){e.preventDefault();Eye.down(e)});
  this.place();
 },
 place:function(){
  if(this.locked){$('eyeBtn').classList.add('docked');$('gbot').appendChild($('eyeBtn'))}
  else{
   $('eyeBtn').classList.remove('docked');document.body.appendChild($('eyeBtn'));
   var p=this.pos||{x:innerWidth-72,y:Math.round(innerHeight*0.3)};
   p.x=clamp(p.x,6,innerWidth-110);p.y=clamp(p.y,6,innerHeight-150);
   $('eyeBtn').style.left=p.x+'px';$('eyeBtn').style.top=p.y+'px';this.pos=p;
  }
  $('eyeLockB').textContent=this.locked?'🔒':'🔓';
 },
 toggleLock:function(){this.locked=!this.locked;localStorage.setItem('vexaEyeLock',this.locked?'1':'0');this.place();toast(this.locked?'🔒 Bottom bar me lock':'🔓 Free — drag karo')},
 down:function(e){
  var self=this;
  if(this.locked){this.click();return}
  var sx=e.clientX,sy=e.clientY,ox=$('eyeBtn').offsetLeft,oy=$('eyeBtn').offsetTop,moved=false;
  function mv(ev){var dx=ev.clientX-sx,dy=ev.clientY-sy;
   if(Math.abs(dx)+Math.abs(dy)>7)moved=true;self.dragging=true;
   self.pos={x:clamp(ox+dx,6,innerWidth-110),y:clamp(oy+dy,6,innerHeight-150)};
   $('eyeBtn').style.left=self.pos.x+'px';$('eyeBtn').style.top=self.pos.y+'px'}
  function up(){removeEventListener('pointermove',mv);removeEventListener('pointerup',up);
   if(moved){localStorage.setItem('vexaEyePos',JSON.stringify(self.pos));setTimeout(function(){self.dragging=false},60)}
   else self.click()}
  addEventListener('pointermove',mv);addEventListener('pointerup',up);
 },
 click:function(){
  if(this.dragging)return;
  if(EMBED){try{parent.postMessage({vexa:'eyeClose'},'*')}catch(e){}}
  else location.href='../index.html';
 }
};

/* ============ REGISTRY + UI ============ */
var CATS=['All','Board','Arcade','Brain','Word','Card','Quiz','Action'];
var G=[];
function add(id,name,ic,cat,tag,start){G.push({id:id,name:name,ic:ic,cat:cat,tag:tag,start:start})}
function statRow(){return h('<div class="gbar"></div>')}
function resBar(bar,cls,txt){bar.innerHTML='<div class="bigres '+cls+'" style="width:100%">'+txt+'</div>'}

var UI={
 cur:null,cat:'All',
 stopGame:function(){runClean();TMR.stop();RAF.stop()},
 home:function(){this.stopGame();this.cur=null;
  $('gameView').classList.add('hidden');$('listView').classList.remove('hidden');
  $('backB').classList.add('hidden');$('nbHome').classList.add('act')},
 open:function(g){this.stopGame();$('glog').innerHTML='';this.cur=g;
  $('listView').classList.add('hidden');$('gameView').classList.remove('hidden');
  $('backB').classList.remove('hidden');$('nbHome').classList.remove('act');
  $('gbar').innerHTML='<div style="font-size:19px">'+g.ic+'</div><div style="flex:1"><div style="font-weight:800;font-size:15px">'+g.name+'</div><div class="sm mut">vs '+BOT+' · '+g.tag+' · 🏆 '+HS.get(g.id)+'</div></div><button class="btn bg2 bsm" id="agB">↻</button>';
  $('agB').onclick=function(){UI.open(g)};
  var ar=$('arena');ar.innerHTML='';g.start(ar);$('gameView').scrollTop=0},
 scores:function(){var s='';
  G.forEach(function(g){var v=HS.get(g.id);
   if(v)s+='<div style="display:flex;justify-content:space-between;padding:7px 4px;border-bottom:1px solid var(--bd)"><span>'+g.ic+' '+g.name+'</span><b class="mono">'+v+'</b></div>'});
  gm('🏆 Best Scores',s||'<div class="sm mut">Abhi koi score nahi — khelo!</div>')},
 how:function(){gm('👁️ Eye System','<div class="sm" style="line-height:1.9">• <b>Eye tap</b> = index ↔ Game switch<br>• <b>Drag</b> = kahin bhi rakho (yaad rehta hai)<br>• <b>🔒</b> = bottom bar me dock · <b>🔓</b> = free<br><br>🤖 Offline bot games · 🏆 scores saved<br>← button = game se bahar</div>')},
 render:function(){
  var q=($('srch').value||'').toLowerCase(),self=this,ch='';
  CATS.forEach(function(c){ch+='<div class="chip'+(self.cat===c?' sel':'')+'" data-c="'+c+'">'+c+'</div>'});
  $('chips').innerHTML=ch;
  $('chips').querySelectorAll('.chip').forEach(function(el){
   el.onclick=function(){self.cat=el.getAttribute('data-c');self.render()}});
  var htm='',n=0;
  G.forEach(function(g,i){
   if(self.cat!=='All'&&g.cat!==self.cat)return;
   if(q&&(g.name+' '+g.tag).toLowerCase().indexOf(q)<0)return;
   htm+='<div class="gcard" data-i="'+i+'"><div class="gi">'+g.ic+'</div><div class="gn">'+g.name+'</div><div class="gv">'+g.tag+'</div></div>';n++});
  $('ggrid').innerHTML=htm||'<div class="sm mut">Kuch nahi mila</div>';
  $('ggrid').querySelectorAll('.gcard').forEach(function(el){
   el.onclick=function(){UI.open(G[+el.getAttribute('data-i')])}});
 }
};
 $('srch').addEventListener('input',function(){UI.render()});

/* =================================================================
   ENGINES
================================================================= */

/* ---------- TIC TAC TOE ---------- */
function tttStart(diff){return function(box){
 var st=Array(9).fill(''),bar=statRow(),over=false;box.appendChild(bar);
 var grid=h('<div class="tttg"></div>');box.appendChild(grid);
 function win(s){var W=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
  for(var i=0;i<W.length;i++){var w=W[i];
   if(s[w[0]]&&s[w[0]]===s[w[1]]&&s[w[1]]===s[w[2]])return w}
  return null}
 function full(s){for(var i=0;i<9;i++)if(!s[i])return false;return true}
 function minimax(s,me){var w=win(s);if(w)return me?-1:1;if(full(s))return 0;
  var best=me?99:-99;
  for(var i=0;i<9;i++)if(!s[i]){s[i]=me?'O':'X';var r=minimax(s,!me);s[i]='';
   best=me?Math.min(best,r):Math.max(best,r)}
  return best}
 function paint(hl){for(var i=0;i<9;i++){var c=grid.children[i];
  c.textContent=st[i];c.className='tttc '+(st[i]==='X'?'x':'o')+(hl&&hl.indexOf(i)>-1?' win':'')}}
 function end(w){over=true;paint(w);

function chessStart(depth){return function(box){

 function moves(b,i){

    if(y===home&&!b[(y+2*d)*8+x])out.push((y+2*d)*8+x)}

     if(t&&(t===t.toUpperCase())!==w)out.push(cy*8+cx)}}

  if(left<=0){over=true;HS.set('odd'+size,score);
   bar.innerHTML='<div class="bigres d">'+score+'</div>'}});
 bar.innerHTML='<div class="gstat">0</div>';
 log('Alag emoji wala tap karo!');
 next();
}}

/* ---------- SEQUENCE TAP ---------- */
function seqStart(n){return function(box){
 var t0=null,next=1,over=false;
 var bar=statRow();box.appendChild(bar);
 var grid=h('<div class="memg"></div>');box.appendChild(grid);
 grid.style.gridTemplateColumns='repeat('+Math.ceil(Math.sqrt(n))+',1fr)';
 var nums=[];
 for(var i=1;i<=n;i++)nums.push(i);
 for(var s=nums.length-1;s>0;s--){var sj=rnd(s+1);var tmp=nums[s];nums[s]=nums[sj];nums[sj]=tmp}
 nums.forEach(function(v){
  var c=h('<button class="memc mono" style="color:var(--tx)">'+v+'</button>');
  c.onclick=function(){
   if(over)return;
   if(!t0)t0=Date.now();
   if(v===next){c.classList.add('done');next++;
    if(next>n){over=true;
     var sec=((Date.now()-t0)/1000).toFixed(1);
     HS.set('seq'+n,Math.max(1,Math.round(100-sec*4)));
     bar.innerHTML='<div class="bigres w">🎉 '+sec+'s!</div>'}}
   else c.style.background='var(--dns)'};
  grid.appendChild(c)});
 bar.innerHTML='<div class="gstat">1 → '+n+' order me tap</div>';
}}

/* ---------- CLICKER ---------- */
function clickStart(sec){return function(box){
 var bar=statRow();box.appendChild(bar);
 var btn=h('<button class="btn bp" style="width:100%;height:110px;font-size:23px">👆 TAP!</button>');box.appendChild(btn);
 var n=0,left=sec,running=false,over=false;
 var botTarget=Math.round(sec*(4.2+Math.random()*1.2));
 bar.innerHTML='<div class="gstat you">0</div><div class="gstat bot">🤖 ~'+botTarget+'</div><div class="gstat">⏱️ '+sec+'s</div>';
 btn.onclick=function(){
  if(over)return;
  if(!running){running=true;
   TMR.every(1000,function(){
    if(over)return;
    left--;bar.children[2].textContent='⏱️ '+left+'s';
    if(left<=0){over=true;
     var w=n>=botTarget;HS.set('clk'+sec,n);
     bar.innerHTML='<div class="bigres '+(w?'w':'l')+'">'+n+' vs bot ~'+botTarget+(w?' 🎉':' 😩')+'</div>'}})}
  n++;bar.children[0].textContent=n};
}}

/* ---------- ARCHERY ---------- */
function archStart(windLvl){return function(box){
 var bar=statRow();box.appendChild(bar);
 var cv=h('<canvas class="gcv" width="340" height="240"></canvas>');box.appendChild(cv);
 var pw=h('<div class="pwr"><div class="pf"></div></div>');box.appendChild(pw);
 var btnRow=h('<div class="tc"><button class="btn bp">🏹 Shoot</button></div>');box.appendChild(btnRow);
 var ctx=cv.getContext('2d');
 var wind=windLvl*2.2*(Math.random()<0.5?-1:1);
 var arrows=5,myScore=0,botScore=0,over=false,pow=50,pd=1,lastHit=null;
 function gauss(){return Math.random()+Math.random()+Math.random()-1.5}
 function draw(){
  ctx.clearRect(0,0,340,240);
  var cx=290,cy=120;
  var rings=[[40,'#e74c3c'],[30,'#fff'],[20,'#e74c3c'],[10,'#ffd700']];
  for(var i=0;i<rings.length;i++){
   ctx.beginPath();ctx.arc(cx,cy,rings[i][0],0,7);
   ctx.fillStyle=rings[i][1];ctx.fill()}
  ctx.fillStyle='#9a9ab0';ctx.font='11px sans-serif';
  ctx.fillText('💨 wind '+(wind>0?'→':'←')+Math.abs(wind).toFixed(1),10,18);
  if(lastHit!==null){
   ctx.fillStyle='#111';
   ctx.beginPath();ctx.arc(cx,cy+lastHit,4,0,7);ctx.fill()}}
 RAF.loop(function(){
  if(over)return;
  pow+=pd*1.7;
  if(pow>=95||pow<=8)pd*=-1;
  pw.firstElementChild.style.width=pow+'%';
  draw()});
 function end(){over=true;RAF.stop();
  var w=myScore>botScore;
  resBar(bar,w?'w':'l',w?'🎉 You win '+myScore+'-'+botScore:'😩 '+BOT+' wins '+botScore+'-'+myScore);
  if(w)HS.set('arch'+windLvl,myScore)}
 btnRow.querySelector('button').onclick=function(){
  if(over)return;
  this.disabled=true;
  var b=this;
  var off=(50-pow)*1.5+wind*2.5+(gauss()*4);
  var dist=Math.abs(off);
  var pts=dist<10?10:dist<20?7:dist<30?4:dist<40?2:0;
  lastHit=off;draw();
  myScore+=pts;log('🏹 You: '+pts+' pts');
  var bp=Math.round(clamp(10-Math.abs(gauss()*2.5)-windLvl*0.7,0,10));
  botScore+=bp;log('🤖 '+BOT+': '+bp+' pts');
  arrows--;
  bar.innerHTML='<div class="gstat you">You '+myScore+'</div><div class="gstat bot">'+BOT+' '+botScore+'</div><div class="gstat">🏹 '+arrows+'</div>';
  if(arrows===0)TMR.after(600,end);
  else TMR.after(500,function(){b.disabled=false})};
 bar.innerHTML='<div class="gstat you">You 0</div><div class="gstat bot">'+BOT+' 0</div><div class="gstat">🏹 5</div>';
 log('Power bar peak pe Shoot karo — wind dhyan rakh!');
}}

/* ---------- RPS ---------- */
function rpsStart(target){return function(box){
 var bar=statRow();box.appendChild(bar);
 var row=h('<div class="tc" style="display:flex;gap:12px;justify-content:center;align-items:center;min-height:70px;flex-wrap:wrap"></div>');box.appendChild(row);
 var hist=[],ys=0,bs=0,over=false;
 var IC={r:'✊',p:'✋',s:'✌️'},BEAT={r:'s',p:'r',s:'p'};
 function play(mv){
  if(over)return;
  var bm,f={r:0,p:0,s:0};
  for(var i=0;i<hist.length;i++)f[hist[i]]++;
  if(target<=3)bm=pick(['r','p','s']);
  else{
   var mf='r';
   if(f.p>f[mf])mf='p';
   if(f.s>f[mf])mf='s';
   var counter=null;
   for(var k in BEAT)if(BEAT[k]===mf)counter=k;
   bm=Math.random()<0.7?counter:pick(['r','p','s'])}
  hist.push(mv);
  row.innerHTML='<div style="font-size:42px">'+IC[mv]+'</div><div class="mut">vs</div><div style="font-size:42px">'+IC[bm]+'</div>';
  if(mv===bm)log('🤝 Draw');
  else if(BEAT[mv]===bm){ys++;log('✅ Round win')}
  else{bs++;log('❌ Round lost')}
  bar.innerHTML='<div class="gstat you">You '+ys+'</div><div class="gstat bot">'+BOT+' '+bs+'</div><div class="gstat">First to '+target+'</div>';
  if(ys>=target||bs>=target){over=true;
   var w=ys>bs;HS.set('rps'+target,1);
   row.appendChild(h('<div class="bigres '+(w?'w':'l')+'" style="width:100%">'+(w?'🎉 You win!':'😩 '+BOT+' wins!')+'</div>'));
   var nb=h('<button class="btn bp bsm" style="width:100%">↻ Again</button>');
   nb.onclick=function(){
    ys=0;bs=0;over=false;nb.remove();
    row.innerHTML='';
    for(var r2=0;r2<btns.length;r2++)row.appendChild(btns[r2]);
    bar.innerHTML='<div class="gstat">First to '+target+'</div>'};
   row.appendChild(nb)}}
 var btns=[];
 [['✊','r'],['✋','p'],['✌️','s']].forEach(function(v){
  var b=h('<button class="btn bg2" style="font-size:28px;width:64px;height:64px;border-radius:50%">'+v[0]+'</button>');
  b.onclick=function(){play(v[1])};
  row.appendChild(b);btns.push(b)});
 bar.innerHTML='<div class="gstat">First to '+target+'</div>';
}}
