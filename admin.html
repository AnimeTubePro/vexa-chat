<style>
:root{--bg1:#07090f;--bg2:#0c0f18;--bg3:#121624;--bg4:#181d30;--tx:#e8ecf8;--tx2:#8a93b2;--bd:#232a42;
--ac:#37b6ff;--acs:rgba(55,182,255,.12);--ok:#2ecc71;--oks:rgba(46,204,113,.12);--wn:#f6b93b;--wns:rgba(246,185,59,.12);
--dn:#ff5b5b;--dns:rgba(255,91,91,.12);--gr:linear-gradient(135deg,#37b6ff,#7c5cff)}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:'Poppins',sans-serif;background:var(--bg1);color:var(--tx);font-size:14px;line-height:1.55;min-height:100vh}
.hidden{display:none!important}
.mono{font-family:'JetBrains Mono',monospace}
.mut{color:var(--tx2)}.sm{font-size:12.5px}.mb8{margin-bottom:8px}.mt8{margin-top:8px}.mt16{margin-top:16px}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-thumb{background:#252c48;border-radius:99px}
/* ── gate ── */
#gate{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:22px}
.gcard{width:min(94vw,420px);background:var(--bg2);border:1px solid var(--bd);border-radius:20px;padding:30px 26px;box-shadow:0 30px 80px rgba(0,0,0,.5)}
.glogo{font-size:30px;font-weight:800;letter-spacing:2px;background:var(--gr);-webkit-background-clip:text;background-clip:text;color:transparent;text-align:center}
.gsub{text-align:center;color:var(--tx2);font-size:12.5px;margin:6px 0 20px}
.fld{margin-bottom:14px}
.flbl{display:block;font-size:12px;font-weight:600;color:var(--tx2);margin-bottom:6px;letter-spacing:.4px}
.inp{width:100%;background:var(--bg3);border:1px solid var(--bd);color:var(--tx);border-radius:11px;padding:12px 14px;font-size:14px;outline:none;font-family:inherit}
.inp:focus{border-color:var(--ac)}
.ebox{display:none;background:var(--dns);border:1px solid var(--dn);color:var(--dn);border-radius:11px;padding:10px 13px;font-size:12.5px;margin-bottom:13px;word-break:break-word}
.ebox.show{display:block}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:none;border-radius:11px;padding:11px 18px;font-family:inherit;font-size:13.5px;font-weight:600;color:#fff;cursor:pointer;background:#263050}
.btn:active{transform:scale(.97)}.btn:disabled{opacity:.5;cursor:not-allowed}
.bp{background:var(--gr)}.bg{background:var(--oks);color:var(--ok);border:1px solid var(--ok)}
.bok{background:var(--oks);color:var(--ok);border:1px solid var(--ok)}
.bwn{background:var(--wns);color:var(--wn);border:1px solid var(--wn)}
.bdn{background:var(--dns);color:var(--dn);border:1px solid var(--dn)}
.bsm{padding:8px 13px;font-size:12px;border-radius:9px}
.bfull{width:100%}
.snote{background:var(--bg3);border:1px solid var(--bd);border-left:3px solid var(--ac);border-radius:10px;padding:11px 13px;font-size:12.5px;color:var(--tx2);margin:10px 0}
/* ── panel ── */
#panel{max-width:1080px;margin:0 auto;padding:18px 16px 90px}
.topb{display:flex;align-items:center;gap:12px;background:var(--bg2);border:1px solid var(--bd);border-radius:16px;padding:14px 18px;margin-bottom:14px;flex-wrap:wrap}
.tlogo{font-size:19px;font-weight:800;letter-spacing:1px;background:var(--gr);-webkit-background-clip:text;background-clip:text;color:transparent}
.rbadge{font-size:10.5px;font-weight:700;letter-spacing:1px;background:var(--acs);color:var(--ac);border:1px solid var(--ac);border-radius:99px;padding:3px 10px}
.wsp{flex:1}
.wname{font-size:12.5px;color:var(--tx2)}
.tabs{display:flex;gap:7px;overflow-x:auto;padding:2px 0 12px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tbn{white-space:nowrap;border:1px solid var(--bd);background:var(--bg2);color:var(--tx2);border-radius:99px;padding:8px 15px;font-size:12.5px;font-weight:600;cursor:pointer;font-family:inherit}
.tbn.act{background:var(--acs);color:var(--ac);border-color:var(--ac)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.stat{background:var(--bg2);border:1px solid var(--bd);border-radius:14px;padding:14px 16px}
.sv{font-size:24px;font-weight:800}.sl{font-size:10.5px;letter-spacing:1.2px;color:var(--tx2);font-weight:600}
.card{background:var(--bg2);border:1px solid var(--bd);border-radius:14px;padding:14px 16px;margin-bottom:10px}
.crow{display:flex;gap:11px;align-items:flex-start}
.cinfo{flex:1;min-width:0}
.cname{font-weight:700;font-size:14px;word-break:break-word}
.cmeta{font-size:11.5px;color:var(--tx2);margin-top:2px;word-break:break-word}
.badge{display:inline-block;font-size:10px;font-weight:700;border-radius:99px;padding:2px 9px;margin-left:6px;vertical-align:1px}
.acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}
.searchrow{display:flex;gap:8px;margin-bottom:12px}
.searchrow .inp{flex:1}
.empt{text-align:center;padding:44px 16px;color:var(--tx2);font-size:13px}
.ei{font-size:34px;margin-bottom:8px}
.pgr{display:flex;gap:8px;justify-content:center;margin:14px 0}
/* ── modal ── */
.mwrap{position:fixed;inset:0;background:rgba(2,4,10,.72);backdrop-filter:blur(3px);z-index:100;display:none;align-items:center;justify-content:center;padding:18px}
.mwrap.open{display:flex}
.mcard{width:min(94vw,540px);max-height:84vh;overflow-y:auto;background:var(--bg2);border:1px solid var(--bd);border-radius:18px;padding:20px}
.mhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.mtitle{font-size:15.5px;font-weight:700}
.mx{background:var(--bg3);border:1px solid var(--bd);color:var(--tx2);width:30px;height:30px;border-radius:9px;cursor:pointer;font-size:14px}
.toasts{position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:999;display:flex;flex-direction:column;gap:8px;width:min(92vw,400px);pointer-events:none}
.toast{background:var(--bg3);border:1px solid var(--bd);border-radius:11px;padding:10px 14px;font-size:12.5px;animation:tIn .22s ease;word-break:break-word}
.toast.ok{border-color:var(--ok);color:var(--ok)}.toast.er{border-color:var(--dn);color:var(--dn)}
@keyframes tIn{from{opacity:0;transform:translateY(-8px)}to{opacity:1}}
.qbar{background:var(--bd);border-radius:99px;height:7px;overflow:hidden}
.qfill{background:var(--gr);height:7px;border-radius:99px}
.secnote{font-size:11.5px;color:var(--tx2);line-height:1.6}
.pwgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:520px){.pwgrid{grid-template-columns:1fr}}
</style>
</head>

<div id="gate">

      <div class="fld hidden" id="pPw2Row"><label class="flbl">CONFIRM NEW PASSWORD</label><input class="inp" id="pPw2" type="password" placeholder="••••••••" autocomplete="new-password"></div>
      <button class="btn bp bfull" onclick="PANEL.gatePwGo()">🔐 Unlock Panel</button>

    </div>

</div>

<!-- ═══ PANEL ═══ -->
<div id="panel" class="hidden">
  <div class="topb">
    <div class="tlogo">VEXA ADMIN</div>

</div></div>

<script>
'use strict';
/* ═══ VEXA ADMIN PANEL v2.7.0 — reset & rebuilt ═══
   Features: Dashboard · Users (ban/vip/verify/role/delete) · Recoveries
   (PanelVault secure vault flow) · Vault Registry · 
   Reports · Support tickets · Posts moderation · Announcements ·
   Version control · Ads info · Audit log · Temp accounts  ·
   Panel security (owner password). Staff CREDENTIALS KABHI nahi dekhta. */

firebase.initializeApp({
  apiKey:"AIzaSyDU-J6_YGJC1CUOr_v3ih_rqWGRyhqB4mw",
  authDomain:"vexa-b3a1d.firebaseapp.com",
  databaseURL:"https://vexa-b3a1d-default-rtdb.firebaseio.com",
  projectId:"vexa-b3a1d",
  storageBucket:"vexa-b3a1d.firebasestorage.app",
  messagingSenderId:"431099898297",
  appId:"1:431099898297:web:3adf83427e1b8c7f9c2e68"
});
let auth=firebase.auth(),db=firebase.database(),myUid=null,myRole=null,usersCache={},page=0;

function t(msg,ok){var e=document.createElement('div');e.className='toast '+(ok?'ok':'er');e.textContent=msg;document.getElementById('toasts').appendChild(e);setTimeout(function(){e.remove()},3200)}
function esc(s){var d=document.createElement('div');d.textContent=String(s==null?'':s);return d.innerHTML}
function FR_ERR(e){var m=(e&&e.message)||String(e||'');return (/permission/i.test(m))?'Permission denied — Firebase Console me NAYA database.rules.json deploy karo (staff users-read). AI tab → health check karo.':m}
function ago(ts){if(!ts)return'—';var s=Math.floor((Date.now()-ts)/1000);if(s<60)return'now';if(s<3600)return Math.floor(s/60)+'m';if(s<86400)return Math.floor(s/3600)+'h';return new Date(ts).toLocaleDateString()}
async function sha256(s){var b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(String(s)));return Array.from(new Uint8Array(b)).map(function(x){return x.toString(16).padStart(2,'0')}).join('')}

const PANEL={
 ROLE:'admin', TABS:[{id:"dash",label:"📊 Dashboard"},{id:"ai",label:"🤖 AI"},{id:"users",label:"👥 Users"},{id:"recoveries",label:"🛡️ Recoveries"},{id:"registry",label:"🗄️ Vault Registry"},{id:"reports",label:"🚨 Reports"},{id:"support",label:"🎫 Support"},{id:"posts",label:"📸 Posts"},{id:"announce",label:"📢 Announce"},{id:"version",label:"📱 Version"},{id:"audit",label:"📜 Audit"}], _tab:'dash', _usersAll:null, _reports:null,

 /* ── GATE ── */
 gateLogin:async function(){
   var em=(document.getElementById('gEmail').value||'').trim();
   var pw=document.getElementById('gPw').value||'';
   var eb=document.getElementById('gateErr');eb.classList.remove('show');
   if(!em||!pw){eb.textContent='Email + password daalo';eb.classList.add('show');return}
   var b=document.getElementById('gBtn');b.disabled=true;b.textContent='Checking…';
   try{
     var cred=await auth.signInWithEmailAndPassword(em,pw);
     myUid=cred.user.uid;
     var s=await db.ref('users/'+myUid+'/role').get();
     var r=s.exists()?s.val():'user';
     if(r!==this.ROLE){
       await auth.signOut();
       eb.innerHTML='❌ Access denied — tera role "<b>'+esc(r)+'</b>" hai, admin nahi.'+(this.ROLE==='owner'?'<br>Role set karne ke liye: Firebase Console → RTDB → users/'+esc(myUid)+'/role → "owner"':'');
       eb.classList.add('show');
     }else{
       myRole=r;await this.afterRole();
     }
   }catch(e){eb.textContent='❌ '+(e&&e.message||'Login fail');eb.classList.add('show')}
   b.disabled=false;b.textContent='🔓 Login as ADMIN';
 },
 afterRole:async function(){
   var self=this;
   try{
     var u=await db.ref('users/'+myUid).get();
     var v=u.val()||{};
     document.getElementById('whoName').textContent=(v.displayName||v.username||'staff')+' · '+auth.currentUser.email;
   }catch(e){}
   if(this.ROLE==='owner'){
     /* owner password gate — panelSecurity/ownerPass {salt,hash,setAt} */
     var pw=null;
     try{pw=(await db.ref('panelSecurity/ownerPass').get()).val()}catch(e){}
     var lk=0;try{lk=parseInt(sessionStorage.getItem('vexaPwLock')||0)}catch(e){}
     if(lk>Date.now()){t('⏳ Panel locked — '+Math.ceil((lk-Date.now())/60000)+' min baad try karo',false);return}
     document.getElementById('gateLogin').classList.add('hidden');
     document.getElementById('gatePw').classList.remove('hidden');
     if(pw&&pw.hash){document.getElementById('pPw2Row').classList.add('hidden')}
     else{document.getElementById('pPw2Row').classList.remove('hidden')}
     this._pwRec=pw||null;
     return;
   }
   this.open();
 },
 gatePwGo:async function(){
   var eb=document.getElementById('pwErr');eb.classList.remove('show');
   var pw=document.getElementById('pPw').value||'';
   if(!pw||pw.length<6){eb.textContent='Password min 6 chars';eb.classList.add('show');return}
   try{
     if(this._pwRec&&this._pwRec.hash){
       var lk=parseInt(sessionStorage.getItem('vexaPwFail')||0);
       var h=await sha256(this._pwRec.salt+pw);
       if(h===this._pwRec.hash){
         sessionStorage.removeItem('vexaPwFail');
         this.open();
       }else{
         lk++;sessionStorage.setItem('vexaPwFail',lk);
         if(lk>=5){sessionStorage.setItem('vexaPwLock',Date.now()+600000);eb.textContent='⛔ 5 galat tries — 10 min lock!';eb.classList.add('show')}
         else{eb.textContent='❌ Galat panel password ('+lk+'/5)';eb.classList.add('show')}
       }
     }else{
       var pw2=document.getElementById('pPw2').value||'';
       if(pw!==pw2){eb.textContent='Dono passwords match nahi kar rahe';eb.classList.add('show');return}
       var salt=Math.random().toString(36).slice(2,14);
       var hash=await sha256(salt+pw);
       await db.ref('panelSecurity/ownerPass').set({salt:salt,hash:hash,setAt:Date.now(),setBy:myUid});
       t('✅ Panel password set ho gaya — ab har baar yahi lagega');
       this.open();
     }
   }catch(e){eb.textContent='❌ '+e.message;eb.classList.add('show')}
 },
 open:function(){
   document.getElementById('gate').classList.add('hidden');
   document.getElementById('panel').classList.remove('hidden');
   this.buildTabs();this.tab('dash');
 },
 logout:async function(){try{await auth.signOut()}catch(e){}location.reload()},

 /* ── TABS ── */
 buildTabs:function(){
   var bar=document.getElementById('tabBar'),h='';
   this.TABS.forEach(function(x){
     h+='<button class="tbn" data-t="'+x.id+'" onclick="PANEL.tab(\''+x.id+'\')">'+x.label+'<span id="'+(x.id==='recoveries'?'recCount':'')+'" style="margin-left:4px"></span></button>';
   });
   bar.innerHTML=h;
 },
 tab:function(name){
   this._tab=name;
   document.querySelectorAll('.tbn').forEach(function(b){b.classList.toggle('act',b.getAttribute('data-t')===name)});
   document.getElementById('statsRow').innerHTML=(name==='dash')?'':'';
   if(name==='ai'&&window.PanelAI)return PanelAI.tab();
   var map={dash:'loadStats',users:'loadUsers',reports:'loadReports',support:'loadSupport',
     posts:'loadPosts',announce:'loadAnnounce',version:'loadVersion',ads:'loadAds',
     temp:'loadTemp',security:'loadSecurity',registry:'loadPasswords',recoveries:'loadRecovery',send:'tabSend',audit:'loadAudit'};
   /* PanelVault secure overrides (recovery/registry/send/audit) */
   if(name==='recoveries'&&typeof this.tabRecoveries==='function')return this.tabRecoveries();
   if(name==='recoveries'&&window.PanelVault)return PanelVault.tab();
   if(name==='registry'&&window.PanelVault)return PanelVault.vaultOverview();
   if(name==='audit'&&window.PanelVault)return PanelVault.auditTab();
   if(name==='send'&&typeof this.tabSend==='function')return this.tabSend();
   var fn=map[name];if(fn&&this[fn])this[fn]();
 },
 modal:function(title,html){
   document.getElementById('mTitle').textContent=title;
   document.getElementById('mBody').innerHTML=html;
   document.getElementById('mwrap').classList.add('open');
 },
 mClose:function(){document.getElementById('mwrap').classList.remove('open')},

 /* ── DASHBOARD ── */
 loadStats:async function(){
   var c=document.getElementById('tabContent');
   c.innerHTML='<div class="empt"><div class="ei">⏳</div>Stats load ho rahe…</div>';
   try{
     var us=await db.ref('users').get(),posts=await db.ref('posts').limitToFirst(1000).get(),
         reps=await db.ref('reports').get(),reqs=await db.ref('recoveryRequests').get(),
         temps=await db.ref('recoveryTemp').get();
     var nu=0,ns=0,staff=0,temp=0,banned=0;
     if(us.exists())us.forEach(function(x){var v=x.val()||{};nu++;if(v.isTempAccount)temp++;if(v.banned)banned++;if(v.role&&v.role!=='user')staff++});
     var np=posts.exists()?posts.numChildren():0;
     var nr=0,nro=0;if(reps.exists())reps.forEach(function(x){nr++;if((x.val()||{}).status==='open')nro++});
     var nreq=0;if(reqs.exists())reqs.forEach(function(x){var v=x.val()||{};if(v.tempUid&&['pending','verifying','admin_recommended','owner_pending'].indexOf(v.status||'pending')>-1)nreq++});
     var pill=document.getElementById('recCount');if(pill)pill.textContent=nreq?('('+nreq+')'):'';
     var h='<div class="stats">'
      +'<div class="stat"><div class="sv">'+nu+'</div><div class="sl">USERS</div></div>'
      +'<div class="stat"><div class="sv">'+np+'</div><div class="sl">POSTS</div></div>'
      +'<div class="stat"><div class="sv">'+nr+'</div><div class="sl">REPORTS</div></div>'
      +'<div class="stat"><div class="sv" style="color:'+(nro?'var(--wn)':'var(--tx)')+'">'+nro+'</div><div class="sl">OPEN REPORTS</div></div>'
      +'<div class="stat"><div class="sv" style="color:'+(nreq?'var(--wn)':'var(--tx)')+'">'+nreq+'</div><div class="sl">PENDING RECOVERY</div></div>'
      +'<div class="stat"><div class="sv">'+staff+'</div><div class="sl">STAFF</div></div>'
      +'<div class="stat"><div class="sv">'+temp+'</div><div class="sl">TEMP ACCOUNTS</div></div>'
      +'<div class="stat"><div class="sv" style="color:'+(banned?'var(--dn)':'var(--tx)')+'">'+banned+'</div><div class="sl">BANNED</div></div>'
      +'</div>';
     /* recent signups */
     var rows=[];if(us.exists())us.forEach(function(x){var v=x.val()||{};if(v.isTempAccount)return;rows.push({k:x.k,v:v})});
     var sorted=rows.sort(function(a,b){return (b.v.createdAt||0)-(a.v.createdAt||0)}).slice(0,6);
     if(sorted.length){
       h+='<div class="card"><div class="cname mb8">🆕 Recent Signups</div>';
       sorted.forEach(function(r){
         h+='<div class="crow" style="padding:6px 0"><div style="font-size:18px">👤</div><div class="cinfo"><div class="cname">@'+esc(r.v.username||'?')+(r.v.verified?' ✔':'')+(r.v.vip?' 💎':'')+'</div><div class="cmeta">'+esc(r.v.email||'')+' · '+ago(r.v.createdAt)+'</div></div><button class="btn bsm" onclick="PANEL.userModal(\''+r.k+'\')">Open</button></div>';
       });
       h+='</div>';
     }
     c.innerHTML=h;
   }catch(e){c.innerHTML='<div class="empt">Load fail: '+FR_ERR(e)+'</div>'}
 },

 /* ── USERS ── */
 loadUsers:async function(q,force){
   var c=document.getElementById('tabContent');
   if(force||!this._usersAll){
     c.innerHTML='<div class="empt"><div class="ei">⏳</div>Users load ho rahe…</div>';
     try{
       var us=await db.ref('users').get();
       usersCache={};this._usersAll=[];
       if(us.exists())us.forEach(function(x){var v=x.val()||{};usersCache[x.k]=v;if(!v.isTempAccount)PANEL._usersAll.push({k:x.k,v:v})});
     }catch(e){c.innerHTML='<div class="empt">Fail: '+FR_ERR(e)+'</div>';return}
   }
   q=(q===undefined||q===null)?(this._uq||''):String(q).toLowerCase();this._uq=q;
   var list=this._usersAll.filter(function(r){
     if(!q)return true;
     return (r.v.username||'').toLowerCase().indexOf(q)>-1||(r.v.email||'').toLowerCase().indexOf(q)>-1||(r.v.displayName||'').toLowerCase().indexOf(q)>-1||r.k.indexOf(q)>-1;
   }).sort(function(a,b){return (b.v.createdAt||0)-(a.v.createdAt||0)});
   var slice=list.slice(0,60),h='';
   h+='<div class="searchrow"><input class="inp" id="uQ" placeholder="Search username / email / UID…" value="'+esc(q)+'" onkeydown="if(event.key===\'Enter\')PANEL.loadUsers(this.value)"><button class="btn bp" onclick="PANEL.loadUsers(document.getElementById(\'uQ\').value)">🔍</button></div>';
   h+='<div class="secnote mb8">'+list.length+' users'+(list.length>60?' (pehle 60 dikhe — search karo)':'')+'</div>';
   if(!slice.length)h+='<div class="empt"><div class="ei">📭</div>Koi user nahi mila</div>';
   var self=this;
   slice.forEach(function(r){
     var v=r.v;
     var rb=v.role&&v.role!=='user'?'<span class="badge" style="background:var(--acs);color:var(--ac)">'+esc(v.role).toUpperCase()+'</span>':'';
     h+='<div class="card"><div class="crow"><div style="font-size:22px">'+(v.banned?'🚫':'👤')+'</div>'
       +'<div class="cinfo"><div class="cname">@'+esc(v.username||'?')+(v.verified?' <span style="color:var(--ok)">✔</span>':'')+(v.vip?' 💎':'')+rb+(v.banned?'<span class="badge" style="background:var(--dns);color:var(--dn)">BANNED</span>':'')+'</div>'
       +'<div class="cmeta">'+esc(v.email||'—')+' · joined '+ago(v.createdAt)+' · UID <span class="mono">'+esc(r.k.slice(0,12))+'…</span></div></div>'
       +'<button class="btn bsm" onclick="PANEL.userModal(\''+r.k+'\')">Manage</button></div></div>';
   });
   c.innerHTML=h;
 },

 uDelete:async function(uid){

 sendAnnounce:async function(){
   var ti=document.getElementById('anT').value.trim(),bo=document.getElementById('anB').value.trim();
   if(!ti||!bo){t('❌ Title + body daalo',false);return}
   if(!confirm('SAB users ko bhejein?'))return;
   try{
     var us=await db.ref('users').get(),n=0,ups={};
     us.forEach(function(x){
       var v=x.val()||{};if(v.banned)return;
       ups['users/'+x.k+'/notifications/'+Date.now().toString(36)+Math.random().toString(36).slice(2,6)]={type:'announce',title:ti,body:bo,read:false,at:Date.now()};
       n++;
       if(n%250===0){db.ref().update(ups);ups={}}
     });
     if(Object.keys(ups).length)await db.ref().update(ups);
     t('✅ Announcement '+n+' users ko bhej diya');
   }catch(e){t('❌ '+e.message,false)}

 loadTemp:async function(){
   var c=document.getElementById('tabContent');

   try{

        +'<button class="btn bdn bsm" onclick="PANEL.purgeTemp(\''+r.k+'\',\''+esc(v.reqId||'')+'\')">🧹 Purge</button></div></div>';

   }catch(e){c.innerHTML='<div class="empt">Fail: '+FR_ERR(e)+'</div>'}
 },
 purgeTemp:async function(tempUid,reqId){
   if(!confirm('🧹 Temp account PURGE?\n\nRTDB data (profile+temp node) delete hoga. Firebase Auth user CF (recoveryTempPurge) se delete hoga — CF deploy na ho to Console se user delete karna hoga.'))return;
   var purged=false;
   try{
     if(window.PanelVault){
       var j=await PanelVault.cf('recoveryTempPurge',{tempUid:tempUid,reqId:reqId});
       if(j&&j.ok){purged=true;t('✅ CF purge OK — auth user + data deleted')}
       else if(j&&j.error&&!j.__missing)throw new Error(j.error);
     }
   }catch(e){t('⚠️ CF fail: '+e.message+' — RTDB-only purge kar raha hoon',false)}
   try{
     var ups={};ups['recoveryTemp/'+tempUid]=null;ups['users/'+tempUid]=null;
     if(reqId)ups['recoveryRequests/'+reqId+'/status']='cancelled';
     await db.ref().update(ups);
     t(purged?'✅ Fully purged':'⚠️ RTDB purge done — Auth user Console me delete karo');
     this.loadTemp();
   }catch(e){t('❌ '+e.message,false)}
 },

 /* ── SECURITY (owner) — panel password change ── */
 loadSecurity:async function(){
   var c=document.getElementById('tabContent');
   c.innerHTML='<div class="card"><div class="cname mb8">🔐 Panel Security</div>'
    +'<div class="snote">Owner console <b>panelSecurity/ownerPass</b> se locked hai (salt+SHA-256 hash — plaintext kabhi store nahi). 5 galat tries → 10 min lock.</div>'
    +'<div class="fld"><label class="flbl">NEW PANEL PASSWORD</label><input class="inp" id="np1" type="password" placeholder="min 6 chars"></div>'
    +'<div class="fld"><label class="flbl">CONFIRM</label><input class="inp" id="np2" type="password"></div>'
    +'<button class="btn bp" onclick="PANEL.setPanelPw()">🔑 Change Panel Password</button></div>';
 },
 setPanelPw:async function(){
   var p1=document.getElementById('np1').value,p2=document.getElementById('np2').value;
   if(!p1||p1.length<6){t('❌ Min 6 chars',false);return}
   if(p1!==p2){t('❌ Match nahi kar rahe',false);return}
   try{
     var salt=Math.random().toString(36).slice(2,14);
     var hash=await sha256(salt+p1);
     await db.ref('panelSecurity/ownerPass').set({salt:salt,hash:hash,setAt:Date.now(),setBy:myUid});
     t('✅ Panel password changed — next login se naya lagega');
   }catch(e){t('❌ '+e.message,false)}
 }
};
window.PANEL=PANEL;window.t=t;window.myUid=null;

/* auth watcher — session already there? seedha role check */
auth.onAuthStateChanged(async function(u){
  if(!u||myUid===u.uid)return;
  myUid=u.uid;window.myUid=u.uid;
  try{
    var s=await db.ref('users/'+u.uid+'/role').get();
    var r=s.exists()?s.val():'user';
    if(r!==PANEL.ROLE){await auth.signOut();return}
    myRole=r;
    if(PANEL.ROLE==='owner'){
      var pw=(await db.ref('panelSecurity/ownerPass').get()).val();
      if(pw&&pw.hash){PANEL._pwRec=pw;document.getElementById('gateLogin').classList.add('hidden');document.getElementById('gatePw').classList.remove('hidden')}
      else{PANEL._pwRec=null;document.getElementById('gateLogin').classList.add('hidden');document.getElementById('gatePw').classList.remove('hidden');document.getElementById('pPw2Row').classList.remove('hidden')}
    }else PANEL.open();
  }catch(e){}
});
document.addEventListener('keydown',function(e){if(e.key==='Escape')PANEL.mClose()});
