<style>
:root{--bg1:#0a0a0f;--bg2:#14141e;--bg3:#1d1d2a;--bg4:#262636;--tx:#f0f0f5;--tx2:#9a9ab0;--tx3:#6a6a80;--ac:#e74c3c;--acs:rgba(231,76,60,.15);--ok:#2ecc71;--oks:rgba(46,204,113,.12);--wn:#f39c12;--wns:rgba(243,156,18,.12);--dn:#e74c3c;--dns:rgba(231,76,60,.12);--bd:rgba(255,255,255,.09);--bds:rgba(255,255,255,.16);--gr:linear-gradient(135deg,#e74c3c,#ff6b6b)}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg1);color:var(--tx);font-size:14.5px;line-height:1.5;min-height:100vh}
.hidden{display:none!important}
::-webkit-scrollbar{width:5px}::-webkit-scrollbar-thumb{background:var(--bg4);border-radius:99px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:10px 18px;border-radius:10px;font-size:13.5px;font-weight:600;cursor:pointer;border:none;color:inherit;transition:.15s}
.btn:active{transform:scale(.97)}
.bp{background:var(--gr);color:#fff}.bg{background:var(--bg3)}.bok{background:var(--ok);color:#fff}.bwn{background:var(--wn);color:#fff}.bdn{background:var(--dn);color:#fff}
.bsm{padding:6px 12px;font-size:12px}.bbk{width:100%}
.inp,.txta{width:100%;padding:12px 14px;background:var(--bg3);border:1.5px solid var(--bd);border-radius:10px;font-size:14px;color:inherit;outline:none;font-family:inherit}
.inp:focus,.txta:focus{border-color:var(--ac)}
.mut{color:var(--tx2)}.sm{font-size:12px}.mono{font-family:monospace}.tc{text-align:center}
.mt8{margin-top:8px}.mt16{margin-top:16px}.mb8{margin-bottom:8px}
#loginView{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:20px;background:radial-gradient(ellipse at 50% -10%,var(--acs),transparent 55%),var(--bg1)}
.lcard{width:100%;max-width:380px;background:var(--bg2);border:1px solid var(--bd);border-radius:20px;padding:28px 24px}
.llogo{font-size:28px;font-weight:900;letter-spacing:5px;text-align:center;background:var(--gr);-webkit-background-clip:text;background-clip:text;color:transparent;margin-bottom:4px}
.lsub{text-align:center;font-size:12px;color:var(--tx2);margin-bottom:22px}
.lerr{background:var(--dns);border:1px solid var(--dn);border-radius:10px;padding:10px 12px;font-size:12.5px;color:#ff8a80;display:none;margin-bottom:12px;line-height:1.6}
.lerr.show{display:block}
#panel{display:none;padding:16px;max-width:900px;margin:0 auto}
.ph{display:flex;align-items:center;justify-content:space-between;padding:14px 0;border-bottom:1px solid var(--bd);margin-bottom:16px;gap:10px;flex-wrap:wrap}
.ph .pt{font-size:20px;font-weight:800}
.ph .pt span{background:var(--gr);-webkit-background-clip:text;background-clip:text;color:transparent}
.badge{display:inline-flex;font-size:10px;font-weight:800;padding:3px 9px;border-radius:6px;margin-left:8px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px;margin-bottom:20px}
.stat{background:var(--bg2);border:1px solid var(--bd);border-radius:14px;padding:15px;text-align:center}
.stat .sv{font-size:22px;font-weight:900}.stat .sl{font-size:10px;color:var(--tx2);font-weight:700}
.tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:12px;margin-bottom:14px}
.tab{padding:9px 16px;border-radius:99px;font-size:13px;font-weight:600;background:var(--bg2);border:1px solid var(--bd);cursor:pointer;white-space:nowrap}
.tab.act{background:var(--acs);border-color:var(--ac);color:#ff8a80}
.card{background:var(--bg2);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
.crow{display:flex;align-items:center;gap:11px}
.cav{width:42px;height:42px;border-radius:50%;background:var(--bg3);display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff;background-size:cover;flex-shrink:0}
.cinfo{flex:1;min-width:0}
.cname{font-weight:700;font-size:14.5px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.cmeta{font-size:11.5px;color:var(--tx2);word-break:break-all;line-height:1.5}
.role-fixed{display:inline-flex;align-items:center;gap:5px;padding:6px 12px;border-radius:8px;font-size:11px;font-weight:800}
.empt{padding:40px 20px;text-align:center;color:var(--tx2)}
.empt .ei{font-size:40px;opacity:.6;margin-bottom:8px}
.rep-reason{font-size:13px;background:var(--wns);border-left:3px solid var(--wn);padding:8px 11px;border-radius:6px;margin:8px 0}
.toastbox{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:99;display:flex;flex-direction:column;gap:8px;width:min(92vw,360px)}
.toast{padding:11px 15px;background:var(--bg4);border:1px solid var(--bds);border-radius:10px;font-size:13px;animation:tin .25s}
.toast.ok{border-left:3px solid var(--ok)}.toast.er{border-left:3px solid var(--dn)}
@keyframes tin{from{opacity:0;transform:translateY(10px)}}
.snote{display:flex;gap:8px;align-items:flex-start;background:var(--bg3);border-radius:8px;padding:9px 12px;font-size:11.5px;color:var(--tx2);margin-top:6px;margin-bottom:6px;line-height:1.5}
.hbtns{display:flex;gap:8px}
.thgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.thc{border:2px solid var(--bd);border-radius:10px;overflow:hidden;cursor:pointer}
.thc.sel{border-color:var(--ac)}
.thp{height:60px;position:relative;padding:8px}
.thp .tb{height:10px;border-radius:99px;margin-bottom:6px}
.thp .td{position:absolute;bottom:7px;right:7px;width:17px;height:17px;border-radius:50%}
.thc .tcn{font-size:11px;font-weight:700;padding:6px 8px;border-top:1px solid var(--bd)}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.fcard{border:2px solid var(--bd);border-radius:10px;padding:13px 11px;cursor:pointer;text-align:center;background:var(--bg2)}
.fcard.sel{border-color:var(--ac)}
.fcard .fs{font-size:18px;margin-bottom:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fcard .fn{font-size:10px;color:var(--tx2)}
.fcard .fn.hl{color:var(--ac);font-weight:700}
.scwrap{display:flex;flex-direction:column;height:60vh}
.scmsgs{flex:1;overflow-y:auto;padding:8px 0;display:flex;flex-direction:column;gap:8px}
.scrow{display:flex;flex-direction:column;max-width:80%}
.scrow.me{align-self:flex-end;align-items:flex-end}
.scrow.them{align-self:flex-start;align-items:flex-start}
.scbub{background:var(--bg3);border-radius:12px;padding:8px 12px;font-size:13.5px;word-break:break-word;white-space:pre-wrap}
.scrow.me .scbub{background:var(--acs)}
.scwho{font-size:10.5px;color:var(--tx3);margin-bottom:2px}
#genModal{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:900;display:none;align-items:center;justify-content:center;padding:16px}
#genModal .gmbox{background:var(--bg2);border:1px solid var(--bd);border-radius:16px;max-width:560px;width:100%;max-height:85vh;overflow-y:auto;padding:20px}
#genModal .gmhd{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
#genModal .gmhd b{font-size:16px}
</style>

/* ---------- THEME ---------- */
function hexA(h,a){var n=parseInt(h.slice(1),16);return 'rgba('+(n>>16&255)+','+(n>>8&255)+','+(n&255)+','+a+')'}
function lighten(h){var n=parseInt(h.slice(1),16);function f(x){return Math.min(255,Math.round(x*1.22))}return 'rgb('+f(n>>16&255)+','+f(n>>8&255)+','+f(n&255)+')'}
const Theme={
 bases:[['Crimson','#e74c3c','#0a0a0f','#14141e','#1d1d2a','#f0f0f5','#9a9ab0'],['Cherry','#ff4757','#120708','#1d0b0d','#291013','#fdeef0','#c98d94'],['AMOLED Red','#ff3838','#000000','#070707','#101010','#fdeaea','#c48a8a'],['Ocean','#2e86de','#0a0f1a','#101828','#182236','#eef4fb','#8fa8c4'],['Forest','#27ae60','#081209','#101c11','#182a19','#e9f6ec','#8bb494'],['Royal Purple','#9b59b6','#0f0812','#180d1e','#22132a','#f6ecfa','#b48cc2'],['Golden','#d4a017','#12100a','#1d1a10','#282417','#faf5e6','#c2b48c'],['Ice','#74b9ff','#0a0e14','#101722','#182031','#eef4fb','#8ba3bd'],['Cyber','#00ffd0','#03110e','#062019','#092e24','#e2fff9','#7ac0b2'],['Steel','#95a5a6','#0d0f10','#161a1b','#1f2526','#f0f3f3','#97a5a6'],['Sunset','#e67e22','#160d08','#221610','#2e1e16','#fdf1e7','#c9a188'],['Midnight','#6c5ce7','#0a0a0f','#12121a','#1a1a26','#f0f0f5','#9a9ab0']],
 variants:['Dark','Light','AMOLED'],
 list:function(){var out=[];for(var i=0;i<this.bases.length;i++){for(var j=0;j<this.variants.length;j++){out.push({id:'a'+i+'_'+j,name:this.bases[i][0]+' '+this.variants[j],ac:this.bases[i][1],i:i,j:j})}}return out},
 apply:function(id){
   var t2=null,lst=this.list();
   for(var k=0;k<lst.length;k++){if(lst[k].id===id){t2=lst[k];break}}
   if(!t2)t2=lst[0];
   var b=this.bases[t2.i],j=t2.j;
   var light=(j===1),amoled=(j===2);
   var R=document.documentElement.style;
   R.setProperty('--ac',b[1]);
   R.setProperty('--gr','linear-gradient(135deg,'+b[1]+','+hexA(b[1],0.78)+')');
   R.setProperty('--acs',hexA(b[1],light?0.12:0.16));
   R.setProperty('--bg1',light?'#f4f5fa':amoled?'#000000':b[2]);
   R.setProperty('--bg2',light?'#ffffff':amoled?'#070707':b[3]);
   R.setProperty('--bg3',light?'#eef0f5':amoled?'#101010':b[4]);
   R.setProperty('--bg4',light?'#e3e6ee':amoled?'#1a1a1a':lighten(b[4]));
   R.setProperty('--tx',light?'#17171f':b[5]);
   R.setProperty('--tx2',light?'#55556a':b[6]);
   R.setProperty('--tx3',light?'#8a8aa0':'#6a6a80');
   R.setProperty('--bd',light?'rgba(0,0,0,.09)':'rgba(255,255,255,.09)');
   R.setProperty('--bds',light?'rgba(0,0,0,.16)':'rgba(255,255,255,.16)');
   try{localStorage.setItem('adminTheme',id)}catch(e){}
 },
 open:function(){
   var cur='a0_0';try{cur=localStorage.getItem('adminTheme')||'a0_0'}catch(e){}
   var h='<div class="thgrid">';
   this.list().forEach(function(x){
     var bg=(x.j===1)?'#f4f5fa':(x.j===2)?'#000':Theme.bases[x.i][2];
     h+='<div class="thc'+(x.id===cur?' sel':'')+'" onclick="Theme.pick(\''+x.id+'\')"><div class="thp" style="background:'+bg+'"><div class="tb" style="background:'+x.ac+'"></div><div class="td" style="background:'+x.ac+'"></div></div><div class="tcn">'+x.name+'</div></div>';
   });
   h+='</div>';
   Admin.modal('🎨 Admin Themes',h);
 },
 pick:function(id){this.apply(id);this.open();t('Theme applied ✅',true)},
 init:function(){var id='a0_0';try{id=localStorage.getItem('adminTheme')||'a0_0'}catch(e){}this.apply(id)}
};

const StaffChat={
 unsub:null,
 start:function(){
   this.stop();
   this.unsub=db.ref('staffChat').limitToLast(100).on('value',function(s){
     var w=document.getElementById('scMsgs');if(!w)return;
     w.innerHTML='';

 send:async function(){

   if(!ti)return t('Title daalo',false);
   try{
     var u=await db.ref('users').get();
     var n=0;
     if(u.exists()){
       var ups=[];
       u.forEach(function(uc){
         ups.push(db.ref('users/'+uc.key+'/notifications').push({type:'announce',title:ti,body:bo,read:false,at:Date.now()}));
         n++;
       });
       await Promise.all(ups);
     }
     t('Sent to '+n+' users ✅',true);
     document.getElementById('anTitle').value='';
     document.getElementById('anBody').value='';
   }catch(e){t('Failed: '+e.message,false)}
 },
 /* ===== STAFF CHAT ===== */
 tabStaffChat:function(){
   var c=document.getElementById('tabContent');
   if(this.staffTabRendered)return;
   c.innerHTML='<div class="card"><div class="cname" style="margin-bottom:8px">💬 Staff Group Chat <span class="sm mut">(Admin + Moderators + Owner)</span></div>'
    +'<div class="scwrap"><div class="scmsgs" id="scMsgs"></div>'
    +'<div style="display:flex;gap:8px;margin-top:10px">'
    +'<input class="inp" id="scInput" placeholder="Message..." onkeydown="if(event.key===\'Enter\'){StaffChat.send()}">'
    +'<button class="btn bp bsm" onclick="StaffChat.send()">➤</button>'
    +'</div></div></div>';
   this.staffTabRendered=true;
   StaffChat.start();
 }
};
