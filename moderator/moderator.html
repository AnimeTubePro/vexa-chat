 variants:['Dark','Light','AMOLED'],
 list:function(){var out=[];for(var i=0;i<this.bases.length;i++){for(var j=0;j<this.variants.length;j++){out.push({id:'m'+i+'_'+j,name:this.bases[i][0]+' '+this.variants[j],ac:this.bases[i][1],i:i,j:j})}}return out},
 apply:function(id){
   var t2=null,lst=this.list();
   for(var k=0;k<lst.length;k++){if(lst[k].id===id){t2=lst[k];break}}
   if(!t2)t2=lst[0];

   var R=document.documentElement.style;

   R.setProperty('--gr','linear-gradient(135deg,'+b[1]+','+hexA(b[1],0.8)+')');

   R.setProperty('--bg1',light?'#f4f5fa':amoled?'#000000':b[2]);
   R.setProperty('--bg2',light?'#ffffff':amoled?'#070707':b[3]);
   R.setProperty('--bg3',light?'#eef0f5':amoled?'#101010':b[4]);
   R.setProperty('--bg4',light?'#e3e6ee':amoled?'#1a1a1a':lighten(b[4]));
   R.setProperty('--tx',light?'#17171f':b[5]);
   R.setProperty('--tx2',light?'#55556a':b[6]);
   R.setProperty('--tx3',light?'#8a8aa0':'#6a806a');
   R.setProperty('--bd',light?'rgba(0,0,0,.09)':'rgba(255,255,255,.09)');
   R.setProperty('--bds',light?'rgba(0,0,0,.16)':'rgba(255,255,255,.16)');
   try{localStorage.setItem('modTheme',id)}catch(e){}
 },
 open:function(){
   var cur='m0_0';try{cur=localStorage.getItem('modTheme')||'m0_0'}catch(e){}

   });

   Mod.modal('🎨 Themes',h);
 },
 pick:function(id){this.apply(id);this.open();t('Theme ✅',true)},
 init:function(){var id='m0_0';try{id=localStorage.getItem('modTheme')||'m0_0'}catch(e){}this.apply(id)}
};

        +'<div style="display:flex;gap:6px;margin-top:10px">'
        +'<button class="btn bok bsm" onclick="Mod.resolve(\''+r.id+'\',\'resolved\')">✓ Resolve</button>'
        +'<button class="btn bg bsm" onclick="Mod.resolve(\''+r.id+'\',\'dismissed\')">✕ Dismiss</button>'
        +'</div></div>';
     });
     c.innerHTML=h;
   }catch(e){c.innerHTML='<div class="empt">Error: '+esc(e.message)+'</div>'}
 },
 resolve:async function(id,status){
   try{await db.ref('reports/'+id+'/status').set(status);t('Report '+status+' ✅',true);this.loadReports();this.loadStats()}
   catch(e){t('Failed',false)}
 },
 /* ===== POSTS ===== */
 loadPosts:async function(){
   var c=document.getElementById('tabContent');
   c.innerHTML='<div class="empt"><div class="ei">⏳</div>Loading posts...</div>';
   try{
     var s=await db.ref('posts').limitToLast(50).get();
     if(!s.exists()){c.innerHTML='<div class="empt"><div class="ei">📭</div>No posts</div>';return}
     var h='';
     var arr=[];
     s.forEach(function(x){arr.push({id:x.key,val:x.val()})});
     arr.reverse();
     arr.forEach(function(p){
       var v=p.val;
       h+='<div class="card"><div class="crow"><div style="font-size:18px">📝</div>'
        +'<div class="cinfo"><div class="cname">'+esc((v.caption||'(no caption)').slice(0,60))+'</div>'
        +'<div class="cmeta">By: <span class="mono">'+esc(v.userId)+'</span> · '+ago(v.createdAt)+'</div></div></div>'
        +'<div style="display:flex;gap:6px;margin-top:10px">'
        +'<button class="btn bdn bsm" onclick="Mod.delPost(\''+p.id+'\')">🗑️ Remove post</button>'
        +'</div></div>';
     });
     c.innerHTML=h;
   }catch(e){c.innerHTML='<div class="empt">Error: '+esc(e.message)+'</div>'}
 },
 delPost:async function(id){
   if(!confirm('Remove this post?'))return;
   try{await db.ref('posts/'+id).remove();await db.ref('likes/'+id).remove();t('Removed ✅',true);this.loadPosts();this.loadStats()}
   catch(e){t('Failed: '+e.message,false)}
 },
 /* ===== STAFF CHAT ===== */
 tabStaffChat:function(){
   var c=document.getElementById('tabContent');
   if(this.staffTabRendered)return;
   c.innerHTML='<div class="card"><div class="cname" style="margin-bottom:8px">💬 Staff Group Chat <span class="sm mut">(Admin + Moderators)</span></div>'
    +'<div class="scwrap"><div class="scmsgs" id="scMsgs"></div>'
    +'<div style="display:flex;gap:8px;margin-top:10px">'
    +'<input class="inp" id="scInput" placeholder="Message..." onkeydown="if(event.key===\'Enter\'){StaffChat.send()}">'
    +'<button class="btn bp bsm" onclick="StaffChat.send()">➤</button>'
    +'</div></div></div>';
   this.staffTabRendered=true;
   StaffChat.start();
 }
};

/* ---------- BOOT ---------- */
try{
  firebase.initializeApp(CFG.firebase);
  auth=firebase.auth();
  db=firebase.database();
  Theme.init();
  FontPicker.init();
  auth.onAuthStateChanged(function(u){
    if(!u)return;
    db.ref('users/'+u.uid+'/role').get().then(function(s){
      var r=s.exists()?s.val():'user';
      if(r==='moderator'||r==='admin'||r==='owner'){
        myUid=u.uid;
        myRole=r;
        Mod.showPanel();
      }
    });
  });
}catch(e){
  var eb=document.getElementById('lErr');
  if(eb){eb.textContent='⚠️ Init error: '+e.message;eb.classList.add('show')}
}
</script>
</body>
</html>
